<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1245"/>
      <stop offset="100%" stop-color="#0c0714"/>
    </radialGradient>
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGlow)" stroke="url(#neonBorder)" stroke-width="12" filter="url(#glow)"/>

  <!-- Sumo dohyo ring accent in background -->
  <ellipse cx="256" cy="390" rx="190" ry="60" fill="#241433" stroke="#ffaa00" stroke-width="6" stroke-dasharray="16, 10"/>

  <!-- Cat Ears -->
  <!-- Left Ear -->
  <polygon points="150,190 110,80 210,140" fill="#ff9800" stroke="#b26a00" stroke-width="6"/>
  <polygon points="152,170 125,98 195,138" fill="#ff80ab"/>
  <!-- Right Ear -->
  <polygon points="362,190 402,80 302,140" fill="#ff9800" stroke="#b26a00" stroke-width="6"/>
  <polygon points="360,170 387,98 317,138" fill="#ff80ab"/>

  <!-- Cat Head & Body (Chonky Ginger Mochi) -->
  <ellipse cx="256" cy="275" rx="155" ry="135" fill="#ff9800" stroke="#b26a00" stroke-width="8"/>

  <!-- Tabby Stripes -->
  <path d="M 236 150 L 256 185 L 276 150" fill="none" stroke="#e65100" stroke-width="10" stroke-linecap="round"/>
  <path d="M 216 160 L 236 195" fill="none" stroke="#e65100" stroke-width="8" stroke-linecap="round"/>
  <path d="M 296 160 L 276 195" fill="none" stroke="#e65100" stroke-width="8" stroke-linecap="round"/>

  <!-- Sumo Headband (Hachimaki) -->
  <rect x="120" y="195" width="272" height="34" rx="10" fill="#ffffff" stroke="#d50000" stroke-width="5"/>
  <circle cx="256" cy="212" r="12" fill="#d50000"/>
  <!-- Headband knot ribbon on right -->
  <path d="M 390 200 Q 425 185 435 220 Q 410 230 392 225 Z" fill="#ffffff" stroke="#d50000" stroke-width="4"/>

  <!-- Cheeks / Cream Muzzle -->
  <ellipse cx="210" cy="305" rx="46" ry="34" fill="#fff3e0"/>
  <ellipse cx="302" cy="305" rx="46" ry="34" fill="#fff3e0"/>

  <!-- Cat Nose -->
  <polygon points="256,285 246,275 266,275" fill="#ff4081"/>

  <!-- Cute Cat Mouth -->
  <path d="M 246 288 Q 235 304 220 298" fill="none" stroke="#3e2723" stroke-width="5" stroke-linecap="round"/>
  <path d="M 266 288 Q 277 304 292 298" fill="none" stroke="#3e2723" stroke-width="5" stroke-linecap="round"/>

  <!-- Whiskers -->
  <!-- Left -->
  <line x1="165" y1="285" x2="105" y2="275" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="300" x2="95" y2="305" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>
  <line x1="165" y1="315" x2="110" y2="335" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="347" y1="285" x2="407" y2="275" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>
  <line x1="347" y1="300" x2="417" y2="305" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>
  <line x1="347" y1="315" x2="402" y2="335" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round"/>

  <!-- Big Arcade Cat Eyes -->
  <!-- Left Eye -->
  <ellipse cx="195" cy="250" rx="24" ry="28" fill="#1b002c"/>
  <circle cx="204" cy="242" r="9" fill="#00f0ff"/>
  <circle cx="188" cy="258" r="4" fill="#ffffff"/>
  <!-- Right Eye -->
  <ellipse cx="317" cy="250" rx="24" ry="28" fill="#1b002c"/>
  <circle cx="326" cy="242" r="9" fill="#00f0ff"/>
  <circle cx="310" cy="258" r="4" fill="#ffffff"/>

  <!-- Rosy Cheeks -->
  <circle cx="160" cy="290" r="16" fill="#ff80ab" opacity="0.6"/>
  <circle cx="352" cy="290" r="16" fill="#ff80ab" opacity="0.6"/>

  <!-- Sumo Mawashi Belt on bottom -->
  <path d="M 175 365 Q 256 395 337 365 L 340 405 Q 256 430 172 405 Z" fill="#9c27b0" stroke="#ffe600" stroke-width="5"/>
  <rect x="236" y="375" width="40" height="35" rx="4" fill="#ffe600"/>

  <!-- Paws (Ready to Shove) -->
  <circle cx="150" cy="355" r="28" fill="#fff3e0" stroke="#b26a00" stroke-width="5"/>
  <circle cx="362" cy="355" r="28" fill="#fff3e0" stroke="#b26a00" stroke-width="5"/>

  <!-- Retro Text Banner at Bottom -->
  <rect x="66" y="420" width="380" height="56" rx="12" fill="#0c0714" stroke="#00f0ff" stroke-width="4"/>
  <text x="256" y="458" font-family="'Press Start 2P', monospace, sans-serif" font-size="24" font-weight="900" fill="#ffe600" text-anchor="middle" letter-spacing="2">MEOWTAL</text>
</svg>
